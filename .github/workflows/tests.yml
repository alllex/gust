name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Put the temp dir on a path with a space
        if: runner.os == 'Windows'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "gust tmp"
          New-Item -ItemType Directory -Force $dir | Out-Null
          "TMP=$dir" >> $env:GITHUB_ENV
          "TEMP=$dir" >> $env:GITHUB_ENV
      - run: python gust.tests.py

  real-gradle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - run: python .github/scenarios/real-gradle.py
