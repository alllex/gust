description = "With --gradle 9.9.0: the wrapper is installed, then run by a Gradle step and by a shell step."

[[steps]]
name = "the wrapper runs as a Gradle step"
run.gradle = { args = "help", expect = { output = ["Welcome to Gradle 9.9.0"] } }

[[steps]]
name = "the wrapper runs from bash as $GRADLE"
run.shell = { command = '"$GRADLE" help', expect = { output = ["Welcome to Gradle 9.9.0"] } }

[setup.layout.project]
"settings.gradle.kts" = 'rootProject.name = "wrapper"'
